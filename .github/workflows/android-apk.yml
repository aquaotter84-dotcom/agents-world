# Build Agents World APK
#
# Debug job runs on every push; builds an unsigned debug APK, no secrets needed.
# (v1 ships debug-only, like Orbit's flow. A signed release job can be added later.)
#
# Layout this workflow assumes:
#   <repo root>/deploy/   capacitor.config.ts, package.json, this workflow's source copy
#   <repo root>/app/      the web app (index.html at its root; no build step)
#   .github/workflows/android-apk.yml  <- this file, copied here from deploy/workflows/

name: Build Agents World APK

on:
  push:
  workflow_dispatch:

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action only answers 10 license prompts, but the current SDK
          # repository has more than that, which fails the step. Accept all
          # licenses ourselves in the next step instead.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Verify web assets present
        run: |
          if [ ! -f ../app/index.html ]; then
            echo "::error::../app/index.html is missing. The Capacitor webDir target must contain the web app."
            exit 1
          fi
          node --check ../app/app.js && echo "app.js syntax OK"

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agents-world-debug-apk
          path: deploy/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
