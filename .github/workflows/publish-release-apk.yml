name: Publish Agents World APK to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID whose agents-world-debug-apk artifact to publish"
        required: true
      tag:
        description: "Release tag to attach the APK to"
        required: true
      asset_name:
        description: "APK asset filename"
        required: false
        default: "agents-world.apk"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: agents-world-debug-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Rename APK
        run: mv apk/app-debug.apk "apk/${{ inputs.asset_name }}"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: apk/${{ inputs.asset_name }}
          body: |
            Agents World Android build (debug-signed APK).
            A living world of real AI minds — each mind thinks via the model, acts in the world feed, and can be chatted with.
            On first launch, enter your BluesMinds API key in the Admin tab (stored on-device only).
            Build run: https://github.com/aquaotter84-dotcom/agents-world/actions/runs/${{ inputs.run_id }}
            Asset: ${{ inputs.asset_name }}
