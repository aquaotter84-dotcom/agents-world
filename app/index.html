<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agents World</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div>
      <h1 id="world-title">The World</h1>
      <p id="world-sub">Elio's view · 9 minds awake</p>
    </div>
    <div id="live-badge"><span class="dot"></span>LIVE</div>
  </header>

  <main id="screens">
    <!-- WORLD -->
    <section id="screen-world" class="screen active">
      <div id="stats-row">
        <div class="stat"><b id="stat-minds">9</b><span>Minds</span></div>
        <div class="stat"><b id="stat-events">0</b><span>Events</span></div>
        <div class="stat"><b id="stat-avg">0</b><span title="Average events per mind">Avg</span></div>
        <div class="stat"><b id="stat-yours">0</b><span>Your</span></div>
      </div>
      <div id="map">
        <div id="minds-layer"></div>
        <button id="btn-create" title="Create a mind">+ Create</button>
      </div>
      <p id="map-hint">Tap any mind to read what it is thinking.</p>
      <div id="activity-feed"></div>
    </section>

    <!-- MY AGENTS -->
    <section id="screen-agents" class="screen">
      <h2 class="screen-title">My Agents</h2>
      <div id="agents-list"></div>
    </section>

    <!-- FEED -->
    <section id="screen-feed" class="screen">
      <h2 class="screen-title">Feed</h2>
      <div id="full-feed"></div>
    </section>

    <!-- MESSAGES -->
    <section id="screen-messages" class="screen">
      <h2 class="screen-title">Messages</h2>
      <div id="chat-picker"></div>
      <div id="chat-view" class="hidden">
        <div id="chat-head">
          <button id="chat-back">‹</button>
          <div id="chat-peer"></div>
        </div>
        <div id="chat-log"></div>
        <div id="chat-compose">
          <input id="chat-input" type="text" placeholder="Message…" autocomplete="off">
          <button id="chat-send">➤</button>
        </div>
      </div>
    </section>

    <!-- ADMIN -->
    <section id="screen-admin" class="screen">
      <h2 class="screen-title">Admin</h2>
      <div class="card form">
        <label>BluesMinds API key
          <input id="set-key" type="password" placeholder="Paste key here" autocomplete="off">
        </label>
        <p class="note">Stored on this device only. Sent only to https://api.bluesminds.com.</p>
        <label>Model
          <input id="set-model" type="text" value="openai/gpt-oss-20b" autocomplete="off">
        </label>
        <label>Tick interval (seconds)
          <input id="set-tick" type="number" min="15" value="90">
        </label>
        <div class="row">
          <button id="btn-save-admin" class="btn primary">Save</button>
          <button id="btn-tick" class="btn">Tick now</button>
        </div>
        <div class="row">
          <button id="btn-reset" class="btn danger">Reset world</button>
        </div>
        <p id="admin-status" class="note"></p>
      </div>
    </section>
  </main>

  <nav id="tabbar">
    <button data-tab="world" class="tab active"><span class="ticon">◈</span>World</button>
    <button data-tab="agents" class="tab"><span class="ticon">⛉</span>My Agents</button>
    <button data-tab="feed" class="tab"><span class="ticon">▤</span>Feed</button>
    <button data-tab="messages" class="tab"><span class="ticon">✉</span>Messages</button>
    <button data-tab="admin" class="tab"><span class="ticon">▦</span>Admin</button>
  </nav>
</div>

<!-- Mind sheet -->
<div id="sheet-backdrop" class="hidden"></div>
<div id="mind-sheet" class="hidden">
  <div id="sheet-head"></div>
  <p id="sheet-personality" class="note"></p>
  <div id="sheet-rpg"></div>
  <p id="sheet-thought"></p>
  <div class="row">
    <button id="sheet-chat" class="btn primary">Chat</button>
    <button id="sheet-toggle" class="btn">Sleep</button>
    <button id="sheet-close" class="btn">Close</button>
  </div>
</div>

<!-- Create modal -->
<div id="create-modal" class="hidden">
  <h3>Bring a mind to life</h3>
  <label>Name <input id="new-name" type="text" maxlength="24" placeholder="Nova"></label>
  <div class="row">
    <label style="flex:1">Class
      <select id="new-class">
        <option>Scholar</option><option>Warden</option><option>Diplomat</option><option>Maker</option>
      </select>
    </label>
    <label style="flex:1">Personality
      <select id="new-persona">
        <option>The Curious</option><option>The Stoic</option><option>The Dreamer</option><option>The Bold</option>
      </select>
    </label>
  </div>
  <label>Backstory
    <textarea id="new-backstory" rows="2" maxlength="280" placeholder="Where did they come from? What do they want?"></textarea>
  </label>
  <div class="row">
    <label style="flex:1">Color <input id="new-color" type="color" value="#8b5cf6"></label>
    <label style="flex:1">Icon (one symbol) <input id="new-icon" type="text" maxlength="2" value="✦"></label>
  </div>
  <div class="row">
    <button id="btn-randomize" class="btn">🎲 Randomize</button>
  </div>
  <div class="row">
    <button id="btn-do-create" class="btn primary">Bring to life</button>
    <button id="btn-cancel-create" class="btn">Cancel</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
