# Build Agents World APK
#
# Debug job runs on every push; builds a debug APK signed with the pinned
# debug key (deploy/debug.keystore), no secrets needed — every build
# installs as an update over the last one.
# (v1 ships debug-only, like Orbit's flow. A signed release job can be added later.)
#
# Layout this workflow assumes:
#   <repo root>/deploy/   capacitor.config.ts, package.json, this workflow's source copy
#   <repo root>/app/      the web app (index.html at its root; no build step)
#   .github/workflows/android-apk.yml  <- this file, copied here from deploy/workflows/

name: Build Agents World APK

on:
  push:
  workflow_dispatch:

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action only answers 10 license prompts, but the current SDK
          # repository has more than that, which fails the step. Accept all
          # licenses ourselves in the next step instead.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Vendor engine into web tree
        run: |
          bash ../tools/sync-vendor.sh
          test -f ../app/vendor/engine/index.js || { echo "::error::engine vendor failed"; exit 1; }
          test -f ../app/vendor/server/prompt.js || { echo "::error::prompt vendor failed"; exit 1; }

      - name: Verify web assets present
        run: |
          if [ ! -f ../app/index.html ]; then
            echo "::error::../app/index.html is missing. The Capacitor webDir target must contain the web app."
            exit 1
          fi
          node --check ../app/app.js && echo "app.js syntax OK"
          node --check ../app/migrate.js && echo "migrate.js syntax OK"

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Pin debug signing key and bump version
        run: |
          # The pinned debug key makes every CI build install as an update
          # over the last one (fresh CI machines would otherwise mint a
          # throwaway key each run and Android would refuse the "update").
          mkdir -p ~/.android
          # The keystore sits beside this workflow's workspace (deploy/),
          # NOT one level up — the original PR #9 step used ../debug.keystore,
          # which never existed; the step only stayed green because the live
          # .github copy of this workflow never received it (see PR #13).
          cp debug.keystore ~/.android/debug.keystore
          # versionCode must rise for Android to accept the update.
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agents-world-debug-apk
          path: deploy/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
