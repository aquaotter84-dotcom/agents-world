# Build Agents World release AAB (Google Play)
#
# Manual-only (workflow_dispatch): builds a signed Android App Bundle with the
# dedicated release keystore and uploads it as a workflow artifact. Download
# the AAB from the run page and upload it to Play Console by hand — nothing
# here talks to Google Play.
#
# Signing: the keystore and passwords arrive as GitHub Secrets and are read
# from environment variables by the generated Gradle project (see
# deploy/scripts/apply-release-signing.mjs). The keystore itself lives
# outside this repo, backed up twice; losing it means the Play listing can
# never be updated, so it never gets committed.
#
# Required repository secrets:
#   AW_RELEASE_KEYSTORE_B64   base64 of agents-world-release.keystore
#   AW_KEYSTORE_PASSWORD      keystore password
#   AW_KEY_PASSWORD           key password
#
# versionCode scheme: 100000 + this workflow's run number. The debug workflow
# stamps its own run number (a different counter, currently far below 100000),
# so release codes stay monotonic and can never collide with the debug
# update path. NEVER delete and recreate this workflow — its run number
# would reset and versionCode would regress. If that ever happens, raise the
# 100000 offset first.
#
# targetSdk: the Capacitor 7 template generates SDK 35, but Play has required
# new apps to target API 36 (Android 16) since 2026-08-31. The signing script
# stamps 36 into the generated project for release builds only; the debug
# workflow's build is untouched.
#
# Layout mirrors android-apk.yml:
#   <repo root>/deploy/   capacitor.config.ts, package.json, workflow sources
#   <repo root>/app/      the web app (index.html at its root; no build step)
#   .github/workflows/android-release-aab.yml  <- this file, copied from
#                                                 deploy/workflows/

name: Build Agents World release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Play versionName for this build"
        required: false
        default: "1.0.0"

permissions:
  contents: read

jobs:
  release-aab:
    name: Signed release AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Same license workaround as the debug workflow: accept all
          # licenses ourselves in the next step.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android 36 platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Vendor engine into web tree
        run: |
          bash ../tools/sync-vendor.sh
          test -f ../app/vendor/engine/index.js || { echo "::error::engine vendor failed"; exit 1; }
          test -f ../app/vendor/server/prompt.js || { echo "::error::prompt vendor failed"; exit 1; }

      - name: Verify web assets present
        run: |
          if [ ! -f ../app/index.html ]; then
            echo "::error::../app/index.html is missing. The Capacitor webDir target must contain the web app."
            exit 1
          fi
          node --check ../app/app.js && echo "app.js syntax OK"
          node --check ../app/migrate.js && echo "migrate.js syntax OK"

      - name: Decode release keystore from secrets
        env:
          AW_RELEASE_KEYSTORE_B64: ${{ secrets.AW_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$AW_RELEASE_KEYSTORE_B64" ]; then
            echo "::error::AW_RELEASE_KEYSTORE_B64 secret is not set — cannot sign the release build."
            exit 1
          fi
          echo "$AW_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agents-world-release.keystore"
          chmod 600 "$RUNNER_TEMP/agents-world-release.keystore"
          echo "AW_KEYSTORE_PATH=$RUNNER_TEMP/agents-world-release.keystore" >> "$GITHUB_ENV"

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply release signing and SDK 36
        run: node scripts/apply-release-signing.mjs

      - name: Compute versionCode
        run: echo "AW_VERSION_CODE=$((100000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          AW_KEYSTORE_PASSWORD: ${{ secrets.AW_KEYSTORE_PASSWORD }}
          AW_KEY_PASSWORD: ${{ secrets.AW_KEY_PASSWORD }}
          AW_KEY_ALIAS: agents-world-release
          AW_VERSION_NAME: ${{ inputs.version_name }}
        run: cd android && ./gradlew bundleRelease

      - name: Verify AAB signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::AAB not produced"; exit 1; }
          keytool -printcert -jarfile "$AAB" > /tmp/aab-cert.txt 2>&1 || true
          if ! grep -q "SHA256:" /tmp/aab-cert.txt; then
            echo "::error::AAB carries no signer certificate — refusing to ship an unsigned bundle"
            cat /tmp/aab-cert.txt
            exit 1
          fi
          grep -m1 "Owner:" /tmp/aab-cert.txt

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: agents-world-release-aab
          path: deploy/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
